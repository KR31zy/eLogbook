<!DOCTYPE html>
<html>
<head>
    <title>Logbook Templates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Logbook Templates</h2>
        
        {% if templates %}
            <div class="list-group">
                {% for template in templates %}
                    <div class="list-group-item">
                        <h5>{{ template.name }}</h5>
                        <p>{{ template.description }}</p>
                        <a href="{% url 'logbook:edit_logbook' template.id %}" class="btn btn-primary btn-sm">
                            Start Logbook
                        </a>
                        <a href="{% url 'logbook:download_template' template.id %}" class="btn btn-secondary btn-sm">
                            Download Template
                        </a>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-info">
                No logbook templates available. Please contact your administrator.
            </div>
        {% endif %}
        
        <a href="{% url 'accounts:dashboard' %}" class="btn btn-secondary mt-3">Back to Dashboard</a>
    </div>
</body>
</html>
