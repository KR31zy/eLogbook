<div class="introduction-section" id="introduction">
    <h2>Introduction</h2>

    {% if is_editing %}
    <form method="POST" action="{% url 'reports:edit_introduction' report.id %}" class="edit-form">
        {% csrf_token %}
        <div class="form-group">
            <textarea name="introduction" class="rich-editor form-control" rows="10">{{ report.introduction|safe }}</textarea>
        </div>
        <div class="btn-group mt-3">
            <button type="submit" class="btn btn-primary">Save Introduction</button>
            <a href="{% url 'reports:preview_report' report.id %}" class="btn btn-secondary">Preview Report</a>
        </div>
    </form>
    {% else %}
    <div class="content-section">
        {{ report.introduction|safe }}
    </div>
    {% endif %}
</div>

<style>
    .introduction-section {
        margin: 30px 0;
        page-break-after: always;
    }

    .content-section {
        margin-top: 20px;
        line-height: 1.6;
    }

    .edit-form {
        margin-top: 20px;
    }

    @media print {
        .btn-group {
            display: none;
        }
    }
</style>
