{% extends 'accounts/base.html' %}

{% block title %}Change password{% endblock %}

{% block page_title %}Change password{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Change password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
