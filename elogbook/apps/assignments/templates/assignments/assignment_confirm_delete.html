<!-- assignments/templates/assignments/assignment_confirm_delete.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Delete Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Delete Assignment</h1>
    <p>Are you sure you want to delete the assignment <strong>"{{ assignment.title }}"</strong> for <strong>{{ assignment.intern.user.get_full_name }}</strong>?</p>
    <p class="text-danger">This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'assignments:supervisor_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>
