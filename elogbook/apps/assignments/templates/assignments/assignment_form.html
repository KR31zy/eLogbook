<!-- assignments/templates/assignments/assignment_form.html -->
<!DOCTYPE html>
<html>
<head>
    <title>{{ action }} Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>{{ action }} Assignment</h1>
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="mb-3">
            {{ field.label_tag }}
            {{ field }}
            {% if field.help_text %}
                <div class="form-text">{{ field.help_text }}</div>
            {% endif %}
            {% if field.errors %}
                <div class="alert alert-danger">
                    {{ field.errors }}
                </div>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">Save Assignment</button>
        <a href="{% url 'assignments:supervisor_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>
